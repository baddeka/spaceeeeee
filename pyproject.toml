[project]
name = "ai-review"
version = "0.1.0"
description = "Claude-powered code reviewer and a three-agent web office"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.4", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-review = "reviewer.cli:main"
ai-office = "office.server:main"
ai-office-shot = "office.shot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reviewer", "office"]

[tool.setuptools.package-data]
office = ["static/*", "skills/*/.claude-plugin/*", "skills/*/skills/*/SKILL.md", "skills/*/skills/*/LICENSE.txt"]
